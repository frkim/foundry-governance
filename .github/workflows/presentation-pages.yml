name: Presentation Pages

on:
  push:
    branches: ['**']
    paths:
      - 'presentation/**'
      - 'package.json'
      - 'package-lock.json'
      - 'test/presentation.test.cjs'
      - '.github/workflows/presentation-pages.yml'
  pull_request:
    paths:
      - 'presentation/**'
      - 'package.json'
      - 'package-lock.json'
      - 'test/presentation.test.cjs'
      - '.github/workflows/presentation-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate deck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      html_sha256: ${{ steps.digest.outputs.html_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check dependency advisories
        run: npm audit --audit-level=moderate
      - name: Build presentation
        run: npm run build
      - name: Test presentation
        run: npm test
      - name: Record HTML digest
        id: digest
        run: echo "html_sha256=$(sha256sum _site/index.html | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy and verify Pages
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: presentation-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify published deck matches the build
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA256: ${{ needs.build.outputs.html_sha256 }}
        run: |
          published="$RUNNER_TEMP/published-index.html"
          for attempt in {1..6}; do
            if curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --max-time 30 \
              "${PAGE_URL}?revision=${GITHUB_SHA}" --output "$published" &&
              echo "$EXPECTED_SHA256  $published" | sha256sum --check --status; then
              echo "Published deck verified: $PAGE_URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Published deck did not match the built HTML."
          exit 1
