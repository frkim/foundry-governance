name: Documentation Pages

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presentation:
    name: Build presentation
    uses: ./.github/workflows/presentation-pages.yml

  build:
    name: Build and validate documentation site
    needs: presentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_sha256: ${{ steps.digest.outputs.docs_sha256 }}
      presentation_sha256: ${{ steps.digest.outputs.presentation_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts
      - name: Build documentation
        run: npm run build:docs
      - name: Download presentation from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: presentation
          path: _site/presentation
      - name: Test combined site
        run: npm test
      - name: Record HTML digests
        id: digest
        run: |
          echo "docs_sha256=$(sha256sum _site/index.html | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "presentation_sha256=$(sha256sum _site/presentation/index.html | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy and verify Pages
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: presentation-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify published documentation and presentation match the build
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DOCS_SHA256: ${{ needs.build.outputs.docs_sha256 }}
          PRESENTATION_SHA256: ${{ needs.build.outputs.presentation_sha256 }}
        run: |
          published="$RUNNER_TEMP/published-index.html"
          for target in index.html presentation/index.html; do
            expected="$DOCS_SHA256"
            if [[ "$target" == presentation/index.html ]]; then
              expected="$PRESENTATION_SHA256"
            fi
            verified=false
            for attempt in {1..6}; do
              echo "Verifying published $target (attempt $attempt/6)"
              if curl --fail --silent --show-error --location \
                --proto '=https' --proto-redir '=https' --max-time 30 \
                "${PAGE_URL%/}/${target}?revision=${GITHUB_SHA}" --output "$published" &&
                echo "$expected  $published" | sha256sum --check --status; then
                echo "Published page verified: $target"
                verified=true
                break
              fi
              sleep 10
            done
            if [[ "$verified" != true ]]; then
              echo "::error::Published $target did not match the built HTML."
              exit 1
            fi
          done
